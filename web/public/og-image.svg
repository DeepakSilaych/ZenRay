<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0a1029"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Glow -->
  <ellipse cx="600" cy="200" rx="400" ry="200" fill="#22d3ee" opacity="0.1"/>
  
  <!-- Logo (lightning bolt) -->
  <g transform="translate(540, 120) scale(1.5)">
    <rect width="120" height="120" rx="24" fill="#09090b"/>
    <path d="M65 20L35 65H55L50 100L85 50H62L65 20Z" fill="#22d3ee" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="380" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="white">ZenRay</text>
  <text x="600" y="440" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#94a3b8">Observability for ML/LLM Pipelines</text>
  
  <!-- Bottom fade -->
  <rect y="530" width="1200" height="100" fill="url(#bottomFade)"/>
  <defs>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1029" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a1029"/>
    </linearGradient>
  </defs>
</svg>
