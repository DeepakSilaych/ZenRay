# Redis Cache & Queue
# Run: docker compose -f redis.yml up -d

services:
  redis:
    image: redis:7-alpine
    container_name: zenray-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:

