# PostgreSQL Database
# Run: docker compose -f postgres.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: zenray-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xray_secret}
      POSTGRES_DB: ${POSTGRES_DB:-xray}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xray}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

