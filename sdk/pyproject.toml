[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-sdk"
version = "0.1.0"
description = "XRay SDK for instrumenting multi-step pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.26.0",
  "pydantic==2.5.3",
]

[tool.setuptools]
packages = ["xray"]




