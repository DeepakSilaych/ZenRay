services:
  # Infrastructure Services
  postgres:
    image: postgres:16-alpine
    container_name: zenray-postgres
    environment:
      POSTGRES_USER: xray
      POSTGRES_PASSWORD: xray_secret
      POSTGRES_DB: xray
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xray"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zenray-network

  minio:
    image: minio/minio:latest
    container_name: zenray-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zenray-network

  redis:
    image: redis:7-alpine
    container_name: zenray-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zenray-network

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: zenray-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/xray-blobs --ignore-existing;
      mc anonymous set download myminio/xray-blobs;
      echo 'Bucket created successfully';
      "
    networks:
      - zenray-network

  # FastAPI Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zenray-server
    environment:
      XRAY_POSTGRES_HOST: postgres
      XRAY_POSTGRES_PORT: 5432
      XRAY_POSTGRES_USER: xray
      XRAY_POSTGRES_PASSWORD: xray_secret
      XRAY_POSTGRES_DB: xray
      XRAY_S3_ENDPOINT: http://minio:9000
      XRAY_S3_ACCESS_KEY: minioadmin
      XRAY_S3_SECRET_KEY: minioadmin
      XRAY_S3_BUCKET: xray-blobs
      XRAY_REDIS_HOST: redis
      XRAY_REDIS_PORT: 6379
      XRAY_FRONTEND_URL: http://localhost:5174
      # Google OAuth - set these in .env or override here
      # XRAY_GOOGLE_CLIENT_ID: your-client-id
      # XRAY_GOOGLE_CLIENT_SECRET: your-client-secret
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - zenray-network
    restart: unless-stopped

  # React Dashboard
  mainapp:
    build:
      context: ./mainapp
      dockerfile: Dockerfile
    container_name: zenray-dashboard
    ports:
      - "5174:5174"
    depends_on:
      - server
    networks:
      - zenray-network
    restart: unless-stopped

  # Astro Website
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: zenray-web
    ports:
      - "4000:4000"
    networks:
      - zenray-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  zenray-network:
    driver: bridge
